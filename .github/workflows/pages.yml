name: Publish browser gallery
on:
  push:
    branches: [main]
    paths: ['web/**', 'cloud/**', 'build_web.py', 'app.js', 'index.html', 'style.css', '.github/workflows/pages.yml']
  schedule:
    - cron: '47 13 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5
      - run: node web/test-web.mjs
      - run: node web/test-collections.mjs
      - name: Prepare both galleries
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          from build_web import build, release_cache
          sys.path.insert(0, 'cloud')
          from build_cloud import build_cloud
          with release_cache() as cache:
              build(cache, Path('.web-build'))
              build_cloud(Path('.web-build/cloud'), cache=cache)
              import shutil
              for name in ('library.sqlite3', 'search-index.npz'):
                  shutil.move(cache / name, Path('${{ runner.temp }}') / name)
          PY
      - name: Read daily indexing configuration
        id: daily
        env:
          ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [[ -n "$ACCESS_KEY" && -n "$SECRET_KEY" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the previous daily index
        if: steps.daily.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/daily"
          artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=daily-index-state&per_page=100" --jq 'first(.artifacts[] | select(.workflow_run.head_branch == "main") | [.id, .expired] | @tsv) // empty')
          if [[ -n "$artifact" ]]; then
            read -r id expired <<< "$artifact"
            if [[ "$expired" == true ]]; then
              echo 'Daily checkpoint expired. Restore a backup before continuing.'
              exit 1
            fi
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/daily.zip"
            unzip "$RUNNER_TEMP/daily.zip" -d "$RUNNER_TEMP/daily"
          fi
      - name: Install daily indexing dependencies
        if: steps.daily.outputs.enabled == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rclone
          python -m pip install 'torch>=2.6,<3' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-visual.txt 'requests>=2.32,<3'
      - name: Collect charts and update similarity search
        if: steps.daily.outputs.enabled == 'true'
        env:
          DAILY_R2_REMOTE: cloud:roblox-thumbnails
          RCLONE_CONFIG_CLOUD_TYPE: s3
          RCLONE_CONFIG_CLOUD_PROVIDER: Cloudflare
          RCLONE_CONFIG_CLOUD_REGION: auto
          RCLONE_CONFIG_CLOUD_ENDPOINT: https://90f689604f2cc11259dc5fdbe26e6043.r2.cloudflarestorage.com
          RCLONE_CONFIG_CLOUD_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_CLOUD_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          HF_HUB_DISABLE_XET: '1'
        run: python -u cloud/run_daily.py --state "$RUNNER_TEMP/daily" --cache "$RUNNER_TEMP" --rclone rclone --output .web-build/cloud
      - name: Save the daily checkpoint
        if: steps.daily.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daily-index-state
          path: ${{ runner.temp }}/daily/dataset.sqlite3
          retention-days: 90
          overwrite: true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: .web-build
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

