name: Publish browser gallery
on:
  push:
    branches: [main]
    paths: ['web/**', 'build_web.py', 'app.js', 'index.html', 'style.css', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install numpy==2.3.5
      - run: node web/test-web.mjs
      - run: node web/test-collections.mjs
      - run: python build_web.py --from-release --output .web-build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .web-build
      - id: deployment
        uses: actions/deploy-pages@v4
